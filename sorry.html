<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I'm Sorry 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ee;--bg2:#e9d5ff;--bg3:#c7e9fb;--ink:#7a2a55;--card:rgba(255,255,255,.55);--btn:#ff6fa5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1130;--bg2:#241a4d;--bg3:#12304a;--ink:#ffd3e6;--card:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg1:#3a1130;--bg2:#241a4d;--bg3:#12304a;--ink:#ffd3e6;--card:rgba(255,255,255,.1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-size:200% 200%;animation:bg 14s ease-in-out infinite;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink)}
@keyframes bg{50%{background-position:100% 100%}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none}
.card{pointer-events:none;text-align:center;padding:clamp(22px,5vw,40px) clamp(24px,6vw,52px);border-radius:32px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 50px rgba(255,111,165,.25);max-width:92vw;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 5s ease-in-out 1s infinite}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes float{50%{transform:translateY(-10px)}}
h1{font-family:'Dancing Script',cursive;font-size:clamp(3rem,15vw,5.5rem);margin:0;line-height:1;background:linear-gradient(90deg,#ff5f9e,#b66dff,#ff9ac1);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
p{margin:.6em 0 1.2em;font-size:clamp(1rem,4vw,1.2rem);min-height:1.5em}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:13px 26px;cursor:pointer;color:#fff;background:var(--btn);box-shadow:0 6px 18px rgba(255,111,165,.5);transition:transform .2s}
button:hover{transform:scale(1.08)}button:active{transform:scale(.94)}
#no{background:#a98bd9;box-shadow:0 6px 18px rgba(169,139,217,.5);position:relative}
.heart{position:fixed;pointer-events:none;font-size:22px;animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translateY(-140px) scale(1.5);opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wrap"><div class="card">
<h1 id="t">I'm Sorry</h1>
<p id="s">Tap anywhere 🌸</p>
<div class="row" id="row"><button id="yes">Forgive me? 💖</button><button id="no">No 🙈</button></div>
</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
const R=(a,b)=>a+Math.random()*(b-a);
const cols=['#ff6fa5','#ff9ac1','#ffb3d1','#c77dff','#ffd166','#ff8fab','#fff'];
const flowers=[],bf=[],petals=[];
const mouse={x:W/2,y:H/2};
function addFlower(px,py,s){
  if(flowers.length>60)flowers.shift();
  flowers.push({x:px,y:py,r:s||R(18,38),t:0,col:cols[(Math.random()*cols.length)|0],n:(R(5,8))|0,rot:R(0,6),sx:px+R(-30,30)});
}
function addBf(px,py){
  bf.push({x:px,y:py,a:R(0,6.28),sz:R(14,26),ph:R(0,6),h:(Math.random()*360)|0,sp:R(1,2.2)});
}
for(let i=0;i<5;i++)addBf(R(0,W),R(0,H));
for(let i=0;i<7;i++)setTimeout(()=>addFlower(R(30,W-30),R(H*.55,H-30)),400+i*250);
for(let i=0;i<45;i++)petals.push({x:R(0,W),y:R(-H,H),r:R(5,10),v:R(.5,1.4),w:R(0,6),rot:R(0,6),col:cols[(Math.random()*3)|0]});

function drawFlower(f){
  const g=Math.min(f.t,1),e=1-Math.pow(1-g,3),sg=Math.min(f.t*1.6,1);
  // stem
  x.strokeStyle='#6fbf73';x.lineWidth=3;x.lineCap='round';
  x.beginPath();x.moveTo(f.sx,H+5);
  const ty=H+5+(f.y-H-5)*sg,tx=f.sx+(f.x-f.sx)*sg;
  x.quadraticCurveTo(f.sx,(H+ty)/2,tx,ty);x.stroke();
  if(f.t<.5)return;
  const k=Math.min((f.t-.5)*2,1),b=1-Math.pow(1-k,3),sw=Math.sin(perf/700+f.rot)*.08;
  x.save();x.translate(f.x,f.y);x.rotate(f.rot+sw+k*1.2);
  for(let i=0;i<f.n;i++){
    x.save();x.rotate(i/f.n*6.283);
    x.fillStyle=f.col;x.globalAlpha=.9;
    x.beginPath();x.ellipse(0,-f.r*.6*b,f.r*.32*b,f.r*.6*b,0,0,6.283);x.fill();
    x.restore();
  }
  x.globalAlpha=1;x.fillStyle='#ffd166';
  x.beginPath();x.arc(0,0,f.r*.25*b,0,6.283);x.fill();
  x.restore();
}
function drawBf(b){
  const fl=Math.abs(Math.sin(b.ph)),s=b.sz;
  x.save();x.translate(b.x,b.y);x.rotate(b.a+Math.PI/2);
  for(const side of[-1,1]){
    x.save();x.scale(side*(.25+.75*fl),1);
    x.fillStyle=`hsl(${b.h},90%,70%)`;
    x.beginPath();x.ellipse(s*.5,-s*.35,s*.55,s*.8,.5,0,6.283);x.fill();
    x.fillStyle=`hsl(${b.h+30},90%,80%)`;
    x.beginPath();x.ellipse(s*.38,s*.4,s*.38,s*.5,-.4,0,6.283);x.fill();
    x.fillStyle='rgba(255,255,255,.7)';
    x.beginPath();x.arc(s*.5,-s*.45,s*.12,0,6.283);x.fill();
    x.restore();
  }
  x.strokeStyle='#5b3a6b';x.lineWidth=2;x.beginPath();x.moveTo(0,-s*.6);x.lineTo(0,s*.6);x.stroke();
  x.restore();
}
let perf=0,last=0;
function loop(t){
  perf=t;const dt=Math.min((t-last)/16,3);last=t;
  x.clearRect(0,0,W,H);
  for(const p of petals){
    p.y+=p.v*dt;p.x+=Math.sin(t/900+p.w)*.6;p.rot+=.02*dt;
    if(p.y>H+10){p.y=-10;p.x=R(0,W)}
    x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.globalAlpha=.7;
    x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,6.283);x.fill();x.restore();
  }
  x.globalAlpha=1;
  for(const f of flowers){f.t+=.012*dt;drawFlower(f)}
  for(const b of bf){
    b.ph+=.28*dt;
    const d=Math.hypot(mouse.x-b.x,mouse.y-b.y);
    let ta=Math.atan2(mouse.y-b.y,mouse.x-b.x);
    const want=d>140?ta+Math.sin(t/500+b.h)*.9:b.a+Math.sin(t/300+b.h)*.5+1.5*(d<60?1:0);
    let df=want-b.a;df=Math.atan2(Math.sin(df),Math.cos(df));
    b.a+=df*.05*dt;
    b.x+=Math.cos(b.a)*b.sp*dt*1.3;b.y+=Math.sin(b.a)*b.sp*dt*1.3+Math.sin(b.ph)*.4;
    if(b.x<-40)b.x=W+40;if(b.x>W+40)b.x=-40;if(b.y<-40)b.y=H+40;if(b.y>H+40)b.y=-40;
    drawBf(b);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function heart(px,py){
  const h=document.createElement('div');h.className='heart';h.textContent=['💖','🌸','✨','💗'][(Math.random()*4)|0];
  h.style.left=px-11+'px';h.style.top=py-11+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1700);
}
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('pointerdown',e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;
  if(e.target.closest('button'))return;
  addFlower(e.clientX,e.clientY);heart(e.clientX,e.clientY);
  if(Math.random()<.35)addBf(e.clientX,e.clientY);
  if(bf.length>20)bf.shift();
});
const no=document.getElementById('no');
function dodge(){
  const mx=Math.min(W*.35,140),my=90;
  no.style.transform=`translate(${R(-mx,mx)}px,${R(-my,my)}px) scale(${R(.7,1)})`;
}
no.addEventListener('pointerenter',dodge);
no.addEventListener('pointerdown',e=>{e.preventDefault();dodge()});
document.getElementById('yes').addEventListener('click',e=>{
  document.getElementById('t').textContent='Thank you 💕';
  document.getElementById('s').textContent='I promise to do better 🦋';
  document.getElementById('row').style.display='none';
  for(let i=0;i<14;i++)setTimeout(()=>addBf(W/2,H/2),i*60);
  for(let i=0;i<16;i++)setTimeout(()=>{addFlower(R(20,W-20),R(H*.15,H-20));heart(R(20,W-20),R(H*.3,H-40))},i*120);
  while(bf.length>26)bf.shift();
});
</script>
</body>
</html>
