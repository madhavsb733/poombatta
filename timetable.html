<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>IBPS PO — 50-Day Study Ledger</title>
<style>
  :root{
    /* Ledger-ink palette: deep pine-teal ink, aged paper, brass, oxide-red seal */
    --ink:#182623;
    --ink-light:#5B6E67;
    --paper:#F6F1E3;
    --paper-deep:#ECE2C8;
    --line:#D9C99C;
    --brass:#B07F2E;
    --brass-soft:#D7B876;
    --pine:#1E3B37;
    --pine-deep:#122522;
    --oxide:#A3402A;
    --sage:#3F6B54;
    --rust:#96503A;
    --rust-soft:#E7CBB6;
    --white:#FCFAF3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #24352f 0%, #16221e 55%, #0d1613 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--ink);
    padding:32px 16px 64px;
  }
  .book{
    max-width:760px;
    margin:0 auto;
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box,
      repeating-linear-gradient(180deg, transparent 0 37px, var(--line) 37px 38px);
    background-color:var(--paper);
    border-radius:6px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(176,127,46,.22);
    overflow:hidden;
    position:relative;
  }
  .book::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:10px;
    background: linear-gradient(180deg, var(--pine-deep), var(--pine));
  }
  header.cover{
    padding:34px 34px 22px 46px;
    background:linear-gradient(165deg, var(--pine-deep), var(--pine) 65%, #24443f);
    color:var(--white);
    position:relative;
  }
  header.cover .eyebrow{
    font-family: Georgia, "Iowan Old Style", serif;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--brass-soft);
    margin:0 0 6px;
  }
  header.cover h1{
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight:400;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:.01em;
  }
  header.cover p.sub{
    margin:0;
    font-size:13px;
    color:#C7D3CC;
    font-family: "Courier New", monospace;
  }
  .holder-row{
    display:flex; gap:10px; align-items:baseline; margin-top:16px;
    font-family:"Courier New", monospace; font-size:13px; color:#CFDAD3;
  }
  .holder-row input{
    background:transparent; border:none; border-bottom:1px dashed #4E6A62;
    color:var(--white); font-family:inherit; font-size:13px; padding:4px 4px;
    flex:1; outline:none;
  }
  .holder-row input::placeholder{color:#7C948A;}

  .sync-row{
    display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap;
    font-family:"Courier New", monospace; font-size:12px; color:#CFDAD3;
  }
  .sync-row input[type=text]{
    background:rgba(255,255,255,.07); border:1px solid #3A574F; border-radius:4px;
    color:var(--white); font-family:inherit; font-size:12px; padding:9px 8px;
    flex:1; min-width:160px; outline:none;
  }
  .sync-row input::placeholder{ color:#7C948A; }
  .sync-row button{
    background:var(--brass); border:none; color:var(--pine-deep); font-weight:600;
    font-size:11.5px; padding:9px 14px; border-radius:4px; cursor:pointer; letter-spacing:.02em;
    font-family:"Segoe UI", sans-serif; min-height:38px;
  }
  .sync-row button.secondary{
    background:transparent; border:1px solid #3A574F; color:#CFDAD3; font-weight:400;
  }
  .sync-row .syncstat{ font-size:10.5px; color:#87998F; width:100%; }

  .stats{
    display:grid; grid-template-columns:repeat(4,1fr);
    padding:18px 34px 18px 46px; gap:14px;
    border-bottom:1px solid var(--line);
  }
  .stat{ text-align:left; }
  .stat .num{
    font-family: Georgia, serif; font-size:26px; color:var(--pine); line-height:1;
  }
  .stat .num.red{ color:var(--oxide); }
  .stat .lbl{
    font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-light);
    margin-top:4px;
  }

  .grid-wrap{ padding:22px 34px 8px 46px; }
  .grid-wrap h2{
    font-family:Georgia, serif; font-weight:400; font-size:15px; margin:0 0 4px;
    color:var(--pine);
  }
  .grid-wrap .hint{ font-size:11.5px; color:var(--ink-light); margin:0 0 14px; }

  .daygrid{
    display:grid; grid-template-columns:repeat(10, 1fr); gap:6px;
  }
  .cell{
    position:relative;
    aspect-ratio:1/1;
    min-height:34px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:"Courier New", monospace; font-size:11px; color:var(--ink-light);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cell:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.15); }
  .cell.today{ box-shadow:0 0 0 2px var(--brass); }
  .cell.selected{ box-shadow:0 0 0 2px var(--pine); }
  .cell.testday{ background:repeating-linear-gradient(135deg, var(--white) 0 4px, var(--rust-soft) 4px 8px); color:var(--rust); }
  .cell .fill{
    position:absolute; inset:0; background:var(--brass-soft); opacity:.35;
    border-radius:2px; z-index:0;
  }
  .cell span{ position:relative; z-index:1; font-weight:600; }
  .cell.complete{ background:var(--white); color:var(--oxide); }
  .cell.complete.testday{ color:var(--oxide); }
  .cell.complete .stamp{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .cell.complete .stamp svg{ width:88%; height:88%; opacity:.92; }
  .cell.complete span{ opacity:0; }

  .legend{
    display:flex; gap:16px; flex-wrap:wrap; padding:14px 34px 26px 46px;
    font-size:11px; color:var(--ink-light);
  }
  .legend .dot{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; }

  .detail{
    border-top:2px solid var(--pine);
    padding:26px 34px 34px 46px;
    background:var(--paper-deep);
  }
  .detail h3{
    font-family:Georgia, serif; font-weight:400; font-size:19px; margin:0 0 2px;
    color:var(--pine);
  }
  .detail .datestr{
    font-family:"Courier New", monospace; font-size:12px; color:var(--ink-light); margin:0 0 14px;
  }
  .quotecard{
    border-left:3px solid var(--brass);
    padding:8px 0 8px 14px;
    margin:0 0 20px;
  }
  .quotecard p.qtext{
    font-family:Georgia, "Iowan Old Style", serif;
    font-style:italic;
    font-size:14.5px;
    line-height:1.5;
    color:var(--pine);
    margin:0;
  }
  .quotecard p.qauthor{
    font-family:"Courier New", monospace;
    font-size:11px;
    color:var(--ink-light);
    margin:6px 0 0;
  }
  .quotecard.loading p.qtext{ color:var(--ink-light); font-style:normal; }
  .tasklist{ display:flex; flex-direction:column; gap:0; }
  .task-row{
    padding:12px 0; border-bottom:1px dashed var(--line);
  }
  .task-row:last-child{ border-bottom:none; }
  .task input[type=checkbox]{
    width:20px; height:20px; margin-top:1px; accent-color:var(--sage); cursor:pointer; flex-shrink:0;
  }
  .task .time{
    font-family:"Courier New", monospace; font-size:11.5px; color:var(--brass); width:98px; flex-shrink:0; padding-top:2px;
  }
  .task .label{ font-size:14px; color:var(--pine); }
  .task-row.checked .label{ color:var(--sage); text-decoration:line-through; text-decoration-color:#9CB09F; }
  .task-row{ display:flex; flex-direction:column; width:100%; }
  .task-main{ display:flex; align-items:flex-start; gap:12px; }
  .topic-note{
    display:none; margin:8px 0 4px 32px; width:calc(100% - 32px);
    border:1px solid var(--line); border-radius:4px; padding:8px 9px;
    font-family:"Segoe UI", sans-serif; font-size:13px; background:var(--white);
    outline:none; color:var(--pine);
  }
  .topic-note::placeholder{ color:#9A9484; }
  .task-row.checked .topic-note{ display:block; }
  .topic-note.locked{
    border:none; background:transparent; padding:6px 0 4px 0;
    color:var(--pine); font-style:italic; cursor:default;
    box-shadow:none;
  }

  .testday-card{
    display:flex; flex-direction:column; gap:14px;
  }
  .testday-card .flagline{
    font-family:Georgia, serif; font-size:12px; color:var(--rust); letter-spacing:.05em;
    text-transform:uppercase; margin:0;
  }
  .testday-card label.toggle{
    display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer;
  }
  .testday-card label.toggle input[type=checkbox]{ width:20px; height:20px; accent-color:var(--oxide); }
  .testday-card .scorerow{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .testday-card .scorerow input[type=number]{
    width:90px; border:1px solid var(--line); border-radius:4px; padding:8px 9px;
    font-family:"Segoe UI", sans-serif; font-size:13px; background:var(--white); outline:none;
  }
  .testday-card textarea{
    width:100%; min-height:64px; resize:vertical;
    border:1px solid var(--line); border-radius:4px; padding:9px 10px;
    font-family:"Segoe UI", sans-serif; font-size:13px; background:var(--white);
    outline:none;
  }

  .daystamp{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:14px; font-family:Georgia, serif; font-size:12px;
    color:var(--oxide); border:1px solid var(--oxide); border-radius:20px;
    padding:5px 13px; letter-spacing:.05em;
  }

  footer.actions{
    padding:18px 34px 30px 46px; display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .resetbtn{
    background:none; border:1px solid var(--ink-light); color:var(--ink-light);
    font-size:11px; padding:8px 15px; border-radius:20px; cursor:pointer;
    letter-spacing:.03em; min-height:36px;
  }
  .resetbtn:hover{ border-color:var(--oxide); color:var(--oxide); }
  .status{ font-size:11px; color:var(--ink-light); font-family:"Courier New", monospace; }

  @media (max-width:600px){
    header.cover, .stats, .grid-wrap, .legend, .detail, footer.actions{ padding-left:20px; padding-right:20px; }
    header.cover{ padding-top:26px; padding-bottom:20px; }
    header.cover h1{ font-size:24px; }
    .daygrid{ grid-template-columns:repeat(7,1fr); gap:5px; }
    .stats{ grid-template-columns:repeat(2,1fr); padding-top:16px; padding-bottom:16px; }
    .stat .num{ font-size:22px; }
    .task .time{ width:100%; order:3; margin-left:32px; font-size:11px; }
    .task-main{ flex-wrap:wrap; }
    .task .label{ font-size:14.5px; }
    .sync-row{ flex-direction:column; align-items:stretch; }
    .sync-row input[type=text]{ min-width:0; }
    .sync-row button{ width:100%; }
    footer.actions{ flex-direction:column; align-items:flex-start; }
  }
  @media (max-width:380px){
    .daygrid{ grid-template-columns:repeat(5,1fr); }
    .stats{ grid-template-columns:repeat(2,1fr); gap:10px; }
  }
</style>
</head>
<body>
  <div class="book">
    <header class="cover">
      <p class="eyebrow">Study Passbook</p>
      <h1>IBPS PO — 50-Day Ledger</h1>
      <p class="sub" id="dateRange">— loading —</p>
      <div class="holder-row">
        <span>Candidate:</span>
        <input id="nameInput" placeholder="Enter your name" maxlength="40">
      </div>
      <div class="sync-row">
        <input type="text" id="sheetUrlInput" placeholder="Paste your Google Apps Script Web app URL here">
        <button id="sheetConnectBtn">Connect</button>
        <button id="sheetSyncBtn" class="secondary">Sync now</button>
        <div class="syncstat" id="syncStat">Not connected — data is saved to this account only.</div>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="num red" id="statBanked">0</div><div class="lbl">Days Banked</div></div>
      <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">Current Streak</div></div>
      <div class="stat"><div class="num" id="statBest">0</div><div class="lbl">Best Streak</div></div>
      <div class="stat"><div class="num" id="statPct">0%</div><div class="lbl">Overall Progress</div></div>
    </div>

    <div class="grid-wrap">
      <h2>50-Day Overview</h2>
      <div class="daygrid" id="daygrid"></div>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:var(--white); border:1px solid var(--line);"></span>Not started</span>
      <span><span class="dot" style="background:var(--brass-soft);"></span>In progress</span>
      <span><span class="dot" style="background:var(--oxide);"></span>Complete</span>
      <span><span class="dot" style="background:var(--rust-soft); border:1px solid var(--line);"></span>Test Day</span>
      <span><span class="dot" style="box-shadow:0 0 0 2px var(--brass); background:var(--white);"></span>Today</span>
    </div>

    <div class="detail" id="detail"><!-- rendered by JS --></div>

    <footer class="actions">
      <span class="status" id="statusMsg">Ready.</span>
      <button class="resetbtn" id="resetBtn">Reset all data</button>
    </footer>
  </div>

<script>
(function(){
  // Polyfill window.storage with localStorage when running outside Claude's
  // artifact environment (e.g. hosted on GitHub Pages). If a real
  // window.storage already exists (inside claude.ai), it's left untouched.
  if(!window.storage){
    window.storage = {
      async get(key){
        const v = localStorage.getItem(key);
        if(v===null) throw new Error('not found');
        return { key, value: v, shared:false };
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return { key, value, shared:false };
      },
      async delete(key){
        localStorage.removeItem(key);
        return { key, deleted:true, shared:false };
      },
      async list(prefix){
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(!prefix || (k && k.indexOf(prefix)===0)) keys.push(k);
        }
        return { keys, prefix, shared:false };
      }
    };
  }

  const TASKS = [
    {t:"4:00–4:20 AM",  l:"Wake up, freshen up, water, light stretching"},
    {t:"4:20–6:20 AM",  l:"Quantitative Aptitude — New Concepts"},
    {t:"6:40–8:40 AM",  l:"Reasoning Ability — New Concepts"},
    {t:"9:30–11:00 AM", l:"English"},
    {t:"11:15–12:45 PM",l:"Banking Awareness / Current Affairs"},
    {t:"2:00–4:00 PM",  l:"Practice Session (Quant + Reasoning)"},
    {t:"4:30–6:30 PM",  l:"Topic Tests / Mixed Practice"},
    {t:"7:15–8:45 PM",  l:"Revision + Error Notebook"},
    {t:"8:45–9:30 PM",  l:"Vocabulary + Reading"},
    {t:"9:30–10:00 PM", l:"Plan next day & wind down"},
  ];
  const TOTAL_DAYS = 51; // Day 0 through Day 50
  const MS_DAY = 86400000;
  const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbyw5yv6Mmyi-Kiwq1kCVWRopKDoSJjDjPs6MxsuEePQs4YowB4KALES6ks0T4mxzmq1/exec";

  // One unique line for each day of the plan, Day 0 through Day 50.
  const QUOTES = [
    "Day 0 is not for doubt — it's for direction. Open the notebook.",
    "Small blocks, done daily, outlast one big burst done rarely.",
    "The syllabus doesn't care how you feel. Sit down anyway.",
    "Every error you catch today is a mark you keep tomorrow.",
    "Consistency is the only shortcut that actually works.",
    "You're not behind. You're exactly on Day 5 of a plan you're keeping.",
    "Test Day tells the truth. Let it.",
    "Speed comes after accuracy, never before it.",
    "Reread the mistake, not just the right answer.",
    "The 4 AM version of you is who gets the seat.",
    "Ten blocks a day. That's the whole secret.",
    "Boring, repeated effort is what mastery is made of.",
    "Don't chase every topic — chase the ones you keep missing.",
    "A tired brain still learns, just slower. Show up anyway.",
    "Test Day: grade the paper, not yourself.",
    "Today's puzzle is tomorrow's two-minute solve.",
    "You don't need motivation at 4 AM. You need the alarm and a plan.",
    "Vocabulary compounds. So does silence during practice.",
    "The error notebook is worth more than any new chapter.",
    "Nobody feels ready. Ready is built by Day 20, not felt on Day 1.",
    "Halfway to Day 20 — check the trend, not just today's score.",
    "Rest your eyes, not your discipline.",
    "Speed math is just familiar math done many times.",
    "One weak section fixed is worth ten strong sections revised.",
    "Fatigue lies about how much you have left. Check the ledger instead.",
    "A quarter of the way through — the habit is the real win so far.",
    "Test Day again. Compare this score to Day 6, not to perfection.",
    "The current affairs you skim today is the marks you keep in the exam hall.",
    "Reasoning rewards patience more than speed.",
    "You've sat down thirty mornings in a row that mattered. That's the story.",
    "Halfway. The syllabus is shrinking whether you notice or not.",
    "Puzzles are just patience wearing a disguise.",
    "Every topic note you write is a favor to future, tired you.",
    "Third Test Day — trust the graph, not the mood.",
    "English improves in silence, one passage at a time.",
    "The plan doesn't need your enthusiasm. It needs your attendance.",
    "Sixty percent through. Keep the mornings sacred.",
    "Banking awareness rewards the boring five minutes daily, not one long cram.",
    "A slower correct method beats a fast wrong one, every time.",
    "You are closer to Day 50 than to Day 0 now.",
    "Test Day: this is the one that matters most, and it's not this one.",
    "Two-thirds done. The finish line is a date on a calendar, not a feeling.",
    "Practice tired. The real exam won't ask if you slept well.",
    "Errors you fix in week six don't return in week eight.",
    "Almost there — don't let the last stretch get sloppy.",
    "Speed and calm are the same skill, practiced daily.",
    "Test Day: read every explanation, even for the ones you got right.",
    "Five days out. Consolidate — don't start anything new.",
    "The habit that got you to Day 47 is the one to trust on exam day.",
    "Last stretch. Sleep, revise, repeat — nothing dramatic.",
    "This is the day the other 49 were preparing you for.",
  ];

  function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
  const TODAY = startOfDay(new Date());

  // Fixed plan start: Day 0 = Sunday, July 5, 2026. Days are numbered 0–50.
  // Day 0 itself is a normal study day (not a rest/test day) — Test Days
  // land every 7th day after that: Day 6, 13, 20, 27, 34, 41, 48.
  const START_DATE = startOfDay(new Date(2026, 6, 5));

  const days = [];
  for(let i=0;i<TOTAL_DAYS;i++){
    const d = new Date(START_DATE.getTime() + i*MS_DAY);
    const cyclePos = i % 7; // 0..5 = study days, 6 = Test Day
    days.push({
      index:i,                 // 0..50
      week: Math.floor(i/7)+1,
      cyclePos,
      date:d,
      iso: d.toISOString().slice(0,10),
      isTestDay: cyclePos===6,
      label: d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'})
    });
  }

  let dayData = {};   // iso -> {checks:[bool*10], topics:[...], testDone:bool, score:'', note:''}
  let candidateName = '';
  let selectedIso = null;
  let sheetUrl = '';
  const quoteCache = {}; // iso -> {text, author}

  // Fetches one quote for the given day and caches it (in memory + storage)
  // so the same day always shows the same quote, even after a reload.
  // Falls back to the local QUOTES bank if the network call fails.
  async function fetchDayQuote(iso, indexFallback){
    if(quoteCache[iso]) return quoteCache[iso];
    try{
      const r = await window.storage.get('quote:'+iso, false);
      if(r){ const q = JSON.parse(r.value); quoteCache[iso] = q; return q; }
    }catch(e){ /* not cached yet */ }
    try{
      const res = await fetch('https://dummyjson.com/quotes/random');
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      const q = { text: data.quote, author: data.author || '' };
      quoteCache[iso] = q;
      try{ await window.storage.set('quote:'+iso, JSON.stringify(q), false); }catch(e){}
      return q;
    }catch(e){
      const q = { text: QUOTES[indexFallback % QUOTES.length], author: '' };
      quoteCache[iso] = q;
      return q;
    }
  }

  const fmtRange = `${days[0].date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} — ${days[49].date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;

  function escAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function emptyDay(){ return {checks:new Array(TASKS.length).fill(false), topics:new Array(TASKS.length).fill(''), testDone:false, score:'', note:''}; }

  function pctFor(iso, isTestDay){
    const rec = dayData[iso];
    if(!rec) return 0;
    if(isTestDay) return rec.testDone ? 100 : 0;
    const done = rec.checks.filter(Boolean).length;
    return Math.round((done/TASKS.length)*100);
  }

  async function loadAll(){
    setStatus('Loading your ledger…');
    try{
      const nameRes = await window.storage.get('meta:name', false).catch(()=>null);
      candidateName = nameRes ? JSON.parse(nameRes.value) : '';
    }catch(e){ candidateName=''; }
    document.getElementById('nameInput').value = candidateName;

    try{
      const urlRes = await window.storage.get('meta:sheetUrl', false).catch(()=>null);
      sheetUrl = urlRes ? JSON.parse(urlRes.value) : '';
    }catch(e){ sheetUrl=''; }
    if(!sheetUrl && DEFAULT_SHEET_URL){
      sheetUrl = DEFAULT_SHEET_URL;
      await saveSheetUrl();
    }
    document.getElementById('sheetUrlInput').value = sheetUrl;

    try{
      const listRes = await window.storage.list('day:', false);
      const keys = (listRes && listRes.keys) ? listRes.keys : [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, false);
          if(r) dayData[k.slice(4)] = JSON.parse(r.value);
        }catch(e){ /* skip unreadable key */ }
      }
    }catch(e){ /* no days saved yet */ }

    setStatus('Ready.');
  }

  async function saveDay(iso){
    try{
      const res = await window.storage.set('day:'+iso, JSON.stringify(dayData[iso]), false);
      if(!res) setStatus('Could not save — try again.');
      else setStatus('Saved.');
    }catch(e){ setStatus('Save failed.'); }
    if(sheetUrl) pushDayToSheet(iso);
  }

  async function saveName(){
    try{ await window.storage.set('meta:name', JSON.stringify(candidateName), false); }
    catch(e){ /* non-critical */ }
  }

  async function saveSheetUrl(){
    try{ await window.storage.set('meta:sheetUrl', JSON.stringify(sheetUrl), false); }
    catch(e){ /* non-critical */ }
  }

  function setSyncStat(msg){
    const el = document.getElementById('syncStat');
    if(el) el.textContent = msg;
  }

  async function pushDayToSheet(iso){
    if(!sheetUrl) return;
    const day = days.find(d=>d.iso===iso);
    const rec = dayData[iso];
    if(!day || !rec) return;
    const payload = { date: iso, dayIndex: day.index, cyclePos: day.cyclePos, checks: rec.checks, topics: rec.topics, testDone: rec.testDone, score: rec.score, note: rec.note };
    try{
      await fetch(sheetUrl, { method:'POST', body: JSON.stringify(payload) });
      setSyncStat('Synced to sheet — ' + new Date().toLocaleTimeString());
    }catch(e){
      setSyncStat('Could not reach the sheet (saved locally only). ' + (e && e.message ? e.message : ''));
    }
  }

  async function pullFromSheet(){
    if(!sheetUrl) return false;
    setSyncStat('Pulling from sheet…');
    try{
      const res = await fetch(sheetUrl + (sheetUrl.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
      const json = await res.json();
      if(json && json.ok && Array.isArray(json.days)){
        json.days.forEach(d=>{
          dayData[d.date] = {
            checks: Array.isArray(d.checks) ? d.checks : new Array(TASKS.length).fill(false),
            topics: Array.isArray(d.topics) ? d.topics : new Array(TASKS.length).fill(''),
            testDone: !!d.testDone,
            score: d.score || '',
            note: d.note || ''
          };
        });
        for(const iso in dayData){
          try{ await window.storage.set('day:'+iso, JSON.stringify(dayData[iso]), false); }catch(e){}
        }
        setSyncStat('Synced — ' + new Date().toLocaleTimeString());
        return true;
      }
      setSyncStat('Sheet responded but sent no data.');
      return false;
    }catch(e){
      setSyncStat('Could not reach the sheet. It may not allow requests from here — ' + (e && e.message ? e.message : 'unknown error'));
      return false;
    }
  }

  async function pushAllToSheet(){
    if(!sheetUrl) return;
    setSyncStat('Pushing local data to sheet…');
    const isoList = Object.keys(dayData);
    for(const iso of isoList){
      await pushDayToSheet(iso);
    }
  }

  function setStatus(msg){ document.getElementById('statusMsg').textContent = msg; }

  function stampSVG(){
    return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="50" y="55" text-anchor="middle" font-size="26" font-family="Georgia, serif" fill="currentColor">✓</text></svg>`;
  }

  function renderGrid(){
    const grid = document.getElementById('daygrid');
    grid.innerHTML = '';
    const todayIso = TODAY.toISOString().slice(0,10);
    days.forEach(day=>{
      const pct = pctFor(day.iso, day.isTestDay);
      const cell = document.createElement('div');
      cell.className = 'cell' + (day.isTestDay?' testday':'') + (day.iso===todayIso?' today':'') + (day.iso===selectedIso?' selected':'') + (pct===100?' complete':'');
      cell.title = `Day ${day.index} — ${day.label} — ${day.isTestDay ? 'Test Day' : 'Study Day'} — ${pct}%`;
      if(pct>0 && pct<100){
        const fill = document.createElement('div');
        fill.className='fill';
        fill.style.opacity = (0.15 + (pct/100)*0.55).toFixed(2);
        cell.appendChild(fill);
      }
      if(pct===100){
        const st = document.createElement('div');
        st.className='stamp';
        st.innerHTML = stampSVG();
        cell.appendChild(st);
      }
      const span = document.createElement('span');
      span.textContent = day.index;
      cell.appendChild(span);
      cell.addEventListener('click', ()=>{ selectedIso = day.iso; renderGrid(); renderDetail(); });
      grid.appendChild(cell);
    });
  }

  function renderDetail(){
    const day = days.find(d=>d.iso===selectedIso) || days[0];
    if(!selectedIso) selectedIso = day.iso;
    if(!dayData[day.iso]) dayData[day.iso] = emptyDay();
    const rec = dayData[day.iso];
    if(!rec.topics) rec.topics = new Array(TASKS.length).fill('');
    if(rec.testDone===undefined) rec.testDone = false;
    if(rec.score===undefined) rec.score = '';
    const detail = document.getElementById('detail');
    const pct = pctFor(day.iso, day.isTestDay);

    let html = `<h3>Day ${day.index}${day.isTestDay ? ' — Test Day' : ''}</h3>
      <p class="datestr">${day.date.toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'})} · Week ${day.week} of the plan</p>
      <div class="quotecard loading" id="quoteCard"><p class="qtext" id="quoteText">Fetching today's line…</p></div>`;

    if(day.isTestDay){
      html += `<div class="testday-card">
        <p class="flagline">Day ${day.index} · Full-Length Mock &amp; Review</p>
        <label class="toggle">
          <input type="checkbox" id="testCheck" ${rec.testDone?'checked':''}>
          Completed today's mock test and analysis
        </label>
        <div class="scorerow">
          <span>Score</span>
          <input type="number" id="scoreInput" value="${escAttr(rec.score||'')}" placeholder="e.g. 72">
        </div>
        <textarea id="sundayNote" placeholder="Sectional weak areas, mistakes to fix, adjustments for next week…">${escAttr(rec.note||'')}</textarea>
      </div>`;
    } else {
      html += `<div class="tasklist">`;
      TASKS.forEach((task, i)=>{
        const checked = !!rec.checks[i];
        const topicVal = rec.topics[i] || '';
        const isLocked = topicVal.trim().length > 0;
        html += `<div class="task-row ${checked?'checked':''}" id="row${i}">
          <div class="task-main">
            <input type="checkbox" data-idx="${i}" id="chk${i}" ${checked?'checked':''}>
            <div class="time">${task.t}</div>
            <label class="label" for="chk${i}">${task.l}</label>
          </div>
          <input type="text" class="topic-note ${isLocked?'locked':''}" id="topic${i}" value="${escAttr(topicVal)}" placeholder="What did you study? e.g. Time &amp; Work, Puzzles — Circular Arrangement" ${isLocked?'readonly':''}>
        </div>`;
      });
      html += `</div>`;
    }

    if(pct===100){
      html += `<div class="daystamp">✓ LEDGER BALANCED — ${day.isTestDay ? 'TEST LOGGED' : 'DAY COMPLETE'}</div>`;
    }

    detail.innerHTML = html;

    fetchDayQuote(day.iso, day.index).then(q=>{
      if(selectedIso !== day.iso) return; // user moved to another day meanwhile
      const card = document.getElementById('quoteCard');
      const textEl = document.getElementById('quoteText');
      if(!card || !textEl) return;
      card.classList.remove('loading');
      textEl.textContent = q.text;
      if(q.author){
        const a = document.createElement('p');
        a.className = 'qauthor';
        a.textContent = '— ' + q.author;
        card.appendChild(a);
      }
    });

    if(day.isTestDay){
      document.getElementById('testCheck').addEventListener('change', async (e)=>{
        rec.testDone = e.target.checked;
        await saveDay(day.iso);
        renderGrid(); renderStats(); renderDetail();
      });
      document.getElementById('scoreInput').addEventListener('input', (e)=>{
        rec.score = e.target.value;
        clearTimeout(window.__scoreTimer);
        window.__scoreTimer = setTimeout(()=>saveDay(day.iso), 500);
      });
      let noteTimer;
      document.getElementById('sundayNote').addEventListener('input', (e)=>{
        rec.note = e.target.value;
        clearTimeout(noteTimer);
        noteTimer = setTimeout(()=>saveDay(day.iso), 500);
      });
    } else {
      TASKS.forEach((_, i)=>{
        document.getElementById('chk'+i).addEventListener('change', async (e)=>{
          rec.checks[i] = e.target.checked;
          document.getElementById('row'+i).classList.toggle('checked', e.target.checked);
          if(e.target.checked){
            const tEl = document.getElementById('topic'+i);
            if(!tEl.readOnly) tEl.focus();
          }
          await saveDay(day.iso);
          renderGrid(); renderStats();
          const pctNow = pctFor(day.iso, day.isTestDay);
          if(pctNow===100 && !detail.querySelector('.daystamp')) renderDetail();
          else if(pctNow<100 && detail.querySelector('.daystamp')) renderDetail();
        });
        let topicTimer;
        const topicEl = document.getElementById('topic'+i);
        topicEl.addEventListener('input', (e)=>{
          rec.topics[i] = e.target.value;
          clearTimeout(topicTimer);
          topicTimer = setTimeout(()=>saveDay(day.iso), 500);
        });
        function lockIfWritten(){
          if(topicEl.readOnly) return;
          const val = topicEl.value.trim();
          if(val.length>0){
            clearTimeout(topicTimer);
            rec.topics[i] = topicEl.value;
            topicEl.readOnly = true;
            topicEl.classList.add('locked');
            saveDay(day.iso);
          }
        }
        topicEl.addEventListener('blur', lockIfWritten);
        topicEl.addEventListener('keydown', (e)=>{
          if(e.key==='Enter'){ e.preventDefault(); topicEl.blur(); }
        });
      });
    }
  }

  function renderStats(){
    let banked=0, sumPct=0, elapsed=0;
    let streak=0, best=0, running=0;

    days.forEach(day=>{
      const pct = pctFor(day.iso, day.isTestDay);
      if(pct===100) banked++;
      if(day.date <= TODAY){
        elapsed++; sumPct += pct;
      }
      if(pct===100){ running++; best = Math.max(best, running); }
      else { running = 0; }
    });

    // current streak: consecutive complete days ending at the most recent elapsed day
    for(let i=days.length-1;i>=0;i--){
      const day = days[i];
      if(day.date > TODAY) continue;
      const pct = pctFor(day.iso, day.isTestDay);
      if(pct===100){ streak++; } else { break; }
    }

    document.getElementById('statBanked').textContent = banked;
    document.getElementById('statStreak').textContent = streak;
    document.getElementById('statBest').textContent = best;
    document.getElementById('statPct').textContent = elapsed>0 ? Math.round(sumPct/elapsed)+'%' : '0%';
  }

  document.getElementById('dateRange').textContent = fmtRange;

  document.getElementById('nameInput').addEventListener('input', (e)=>{
    candidateName = e.target.value;
    clearTimeout(window.__nameTimer);
    window.__nameTimer = setTimeout(saveName, 500);
  });

  document.getElementById('sheetConnectBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('sheetUrlInput').value.trim();
    if(!val){ setSyncStat('Paste your Apps Script Web app URL first.'); return; }
    sheetUrl = val;
    await saveSheetUrl();
    const ok = await pullFromSheet();
    if(ok){ await pushAllToSheet(); renderGrid(); renderStats(); renderDetail(); }
  });

  document.getElementById('sheetSyncBtn').addEventListener('click', async ()=>{
    if(!sheetUrl){ setSyncStat('Connect a sheet first.'); return; }
    await pushAllToSheet();
    const ok = await pullFromSheet();
    if(ok){ renderGrid(); renderStats(); renderDetail(); }
  });

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(!confirm('This clears all 50 days of attendance data. This cannot be undone. Continue?')) return;
    setStatus('Resetting…');
    try{
      const listRes = await window.storage.list('day:', false);
      const keys = (listRes && listRes.keys) ? listRes.keys : [];
      for(const k of keys){
        try{ await window.storage.delete(k, false); }catch(e){}
      }
      dayData = {};
      setStatus('All data cleared.');
      renderGrid(); renderStats(); renderDetail();
    }catch(e){ setStatus('Reset failed — try again.'); }
  });

  (async function init(){
    await loadAll();
    selectedIso = TODAY.toISOString().slice(0,10);
    if(!days.find(d=>d.iso===selectedIso)) selectedIso = days[0].iso;
    renderGrid();
    renderStats();
    renderDetail();
    if(sheetUrl){
      const ok = await pullFromSheet();
      if(ok){ renderGrid(); renderStats(); renderDetail(); }
    }
  })();
})();
</script>
</body>
</html>
